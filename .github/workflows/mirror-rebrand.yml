name: Mirror rebrand

# Fully-automated population of the vheditor glibc repo: mirror termux's glibc apt
# repo and rebrand each .deb (equal-length com.termux -> vn.vhn.vsc byte swap; see
# scripts-vh/rebrand-deb.sh), then publish via the vsc.vhn.vn upload path. Delta-aware
# (only new/changed versions) and bounded per run so the initial backlog drains over a
# few scheduled runs and steady-state stays cheap. No source builds, no toolchain.

on:
  schedule:
    - cron: '17 * * * *'      # hourly: drain backlog, then keep in sync with upstream
  push:
    branches: [main]
    paths:
      - '.mirror-trigger'      # touch this file to trigger a drain run without a token
      - '.mirror-refresh'      # push a package list here to force re-rebrand (no token needed)
      - 'scripts-vh/mirror-rebrand.py'
      - 'scripts-vh/rebrand-deb.sh'
      - '.github/workflows/mirror-rebrand.yml'
  workflow_dispatch:
    inputs:
      max:
        description: 'Max packages to rebrand per architecture this run'
        required: false
        default: '40'
      refresh:
        description: 'Force re-rebrand + overwrite these published packages (space-separated names, or "all")'
        required: false
        default: ''

permissions: {}

concurrency:
  group: mirror-rebrand
  cancel-in-progress: false

env:
  MAX_PER_ARCH: '40'

jobs:
  rebrand:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30        # a wedged apt-get/network must not hold the concurrency lock for 6h
    strategy:
      matrix:
        target_arch: [aarch64, arm, i686, x86_64]
      fail-fast: false
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y dpkg binutils xz-utils zstd
    - name: Mirror + rebrand ${{ matrix.target_arch }}
      run: |
        MAX="${{ github.event.inputs.max || env.MAX_PER_ARCH }}"
        # Refresh list: dispatch input wins; else (only on a push) the .mirror-refresh file.
        # Scheduled runs ignore the file so a stale list can't cause endless re-refreshing.
        REFRESH="${{ github.event.inputs.refresh }}"
        if [ -z "$REFRESH" ] && [ "${{ github.event_name }}" = "push" ]; then
          REFRESH="$(tr '\n' ' ' < .mirror-refresh 2>/dev/null || true)"
        fi
        export REFRESH
        echo "REFRESH='${REFRESH}'"
        mkdir -p out artifacts
        python3 scripts-vh/mirror-rebrand.py "${{ matrix.target_arch }}" "$PWD/out" "$MAX"
        tar cf "artifacts/debs-${{ matrix.target_arch }}-${{ github.sha }}.tar" -C out debs
    - name: Store rebranded *.deb files
      uses: actions/upload-artifact@v7.0.1
      with:
        name: debs-${{ matrix.target_arch }}-${{ github.sha }}
        path: ./artifacts

  upload:
    needs: rebrand
    if: github.event_name != 'pull_request'
    permissions:
      contents: write        # REQUIRES repo Settings > Actions > Workflow permissions = Read and write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Get rebranded *.deb files
      uses: actions/download-artifact@v8.0.1
      with:
        merge-multiple: true
        path: ./
    - name: Upload to vsc.vhn.vn
      run: |
        deb_archives=$(find . -name "debs-*-${{ github.sha }}.tar")
        total=$(for t in $deb_archives; do tar tf "$t"; done 2>/dev/null | grep -c '\.deb$' || true)
        deleted=$(for t in $deb_archives; do tar -xOf "$t" debs/deleted_termux-glibc_packages.txt 2>/dev/null; done | grep -c . || true)
        echo "new packages: ${total:-0}; deletions: ${deleted:-0}"
        if [ "${total:-0}" = 0 ] && [ "${deleted:-0}" = 0 ]; then
          echo "nothing to publish or delete; done"
          exit 0
        fi
        # GitHub caps 1000 assets/release, and the server files each upload's debs under a
        # release repos-<sha> keyed by the zip's <sha> (a real commit). Scheduled runs reuse
        # the same HEAD sha, piling every batch into one release until it hits the cap. Make a
        # fresh empty marker commit per upload so each batch (~160 assets) gets its own release.
        # GITHUB_TOKEN pushes don't re-trigger workflows; the empty commit touches no trigger paths.
        git config user.name "vh-mirror-bot"
        git config user.email "mirror@vhn.vn"
        git fetch --depth=1 origin main
        git checkout -B main origin/main
        git commit --allow-empty -m "mirror: release marker for glibc batch [skip ci]"
        git push origin main
        RSHA="$(git rev-parse HEAD)"
        archive="glibc-packages-${RSHA}.zip"
        zip "$archive" $deb_archives
        ls -lh "$archive"
        curl --fail --retry 3 \
          -X POST \
          -H "Authorization: Bearer ${{ secrets.VSC_UPLOAD_TOKEN }}" \
          -F "file=@${archive}" \
          -F "library=glibc" \
          "${{ secrets.VSC_UPLOAD_URL }}"
